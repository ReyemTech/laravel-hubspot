name: js

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref per workflow, for pull requests. A pull request that is pushed to again
# supersedes its own in-flight run rather than paying for both -- 18 pushes on PR #49 each
# started a full set of jobs while the previous set was still running.
#
# Non-pull-request runs are keyed on the COMMIT, not the ref, and that is not cosmetic
# (Codex, local review). `cancel-in-progress: false` does not mean "never superseded": GitHub
# keeps at most ONE pending run per group, so a third push arriving while one run is in
# progress and another is queued REPLACES the queued one. Keyed on the ref, a burst of merges
# to main would silently leave release-candidate commits with no CI run at all. Keyed on the
# sha, every commit gets its own group and can never be superseded by another.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    # Node major pinned to the higher of the two floors this job's tools declare:
    # resources/js/node_modules/vitest's own package.json "engines" permits
    # '^20.0.0 || ^22.0.0 || >=24.0.0' (`npm view vitest engines` against the installed
    # 4.1.10), but pnpm 11.17.0 itself requires Node >=22.13 regardless of any
    # workspace's engines field (`npm view pnpm@11.17.0 engines`) -- Node 20 satisfies
    # Vitest but crashes pnpm at runtime with `ERR_UNKNOWN_BUILTIN_MODULE: node:sqlite`.
    # Node 22 satisfies both. See docs.yml, pinned to Node 22 for the same reason
    # against Astro's >=22.12.0 floor.
    name: js coverage (95% floor, resources/js only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # scripts/ci/paths-changed.sh diffs against the base branch, so the default shallow
          # clone is not enough.
          fetch-depth: 0

      # This job is a REQUIRED status check, so it must always report -- which is why the skip is
      # a step-level condition rather than a workflow-level `paths:` filter. A required check that
      # never reports leaves the pull request stuck on "Expected -- waiting for status to be
      # reported" for ever. The job still runs and still reports green; it just does not spend two
      # minutes installing a JavaScript toolchain for a pull request that changed no JavaScript.
      # PR #49 ran this gate 18 times on a branch that touched none.
      #
      # No `|| true`: the script already fails OPEN by design (an unreachable base ref or a failed
      # diff answers "assume it changed"), and a suppression here would turn a hard failure of the
      # script itself into a silent skip of a real gate.
      - name: Decide whether this pull request touches any JavaScript
        id: scope
        run: |
          # The mode is named because the two events ask different questions of git: a pull
          # request wants "what does this branch change since it forked" (three-dot), a push
          # wants "what did this push do to this ref" (two-dot). See paths-changed.sh.
          mode=""
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin \
              "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
            mode="branch"
          else
            # The whole PUSHED RANGE, not just its tip (Codex, local review). A push can carry
            # several commits, and `HEAD^` would compare against the one before the tip -- so a
            # push whose earlier commit changes what this gate covers and whose tip does not would
            # silently skip a required gate. `github.event.before` is the ref's previous tip.
            #
            # No special case for the all-zero sha of a first push, nor for a force-push whose old
            # tip has been garbage collected: paths-changed.sh already fails OPEN on any ref it
            # cannot resolve, which is the correct answer for both.
            base="${{ github.event.before }}"
            mode="push"
          fi

          if bash scripts/ci/paths-changed.sh "$mode" "$base" \
            'resources/js/*' 'package.json' 'pnpm-lock.yaml' 'pnpm-workspace.yaml' '.npmrc' \
            '.github/workflows/js.yml' 'scripts/ci/paths-changed.sh'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No JavaScript changed, so the coverage gate has nothing to check."
          fi

      - name: Setup pnpm
        if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # Filtered to resources/js's own dependency tree so this install never has to satisfy
      # site/'s Astro engine floor (Node >=22.12.0, higher than Vitest's), which would otherwise
      # break this job's Node 20 the moment site/ existed as a real workspace member with real
      # dependencies (added in plan 06). See docs.yml for the mirror-image filtered install.
      - name: Install dependencies (resources/js only)
        if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --filter './resources/js...'

      # No advisory escape hatch on this step: if this is red, it is red. The 95% floor guards
      # the Phase 8 origin-validating listener and must never be optional.
      - name: Run the frontend coverage gate
        if: steps.scope.outputs.run == 'true'
        run: pnpm --filter './resources/js' exec vitest run --coverage
