name: dependabot-auto-merge

# Auto-merges Dependabot pull requests, but only inside the boundary STANDARDS.md Sec.12c
# sets: patch and minor bumps to *development* dependencies only, on green. Production
# dependency bumps -- the locked seven-package `require` list -- and any major bump always
# require a human, and this job never touches either.
#
# Triggers on `pull_request_target`, not the plain `pull_request` event: GitHub Actions
# workflow runs triggered by Dependabot on `pull_request` always receive a read-only
# GITHUB_TOKEN with no access to secrets, treated exactly as if the PR were opened from a
# fork -- regardless of this workflow's `permissions:` block. (See
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions-for-workflow-runs-triggered-by-dependabot
# and dependabot/fetch-metadata's own README, which documents the identical restriction and
# recommends `pull_request_target` for exactly this reason.) Since the actor guard below
# selects precisely the Dependabot PRs this restriction applies to, `gh pr merge --auto
# --merge` could never succeed under `pull_request` -- it would always fail with a
# permissions error.
#
# `pull_request_target` runs the workflow definition from the base branch (this file, as
# committed to `main`) rather than the PR branch, and grants the elevated token that
# `pull_request` cannot for Dependabot events. That is safe here specifically because this
# job never checks out or executes anything from the PR: `dependabot/fetch-metadata` reads
# PR metadata via the GitHub API, and `gh pr merge` operates on the PR by URL. Any future
# change to this workflow that adds `actions/checkout` of the PR head, or otherwise runs
# PR-controlled code, would reintroduce the exact privilege-escalation risk
# `pull_request_target` is normally criticised for -- don't add one.
#
# Deliberately excluded from tests/Ci/RequiredChecksTest.php's required-checks comparison,
# via that test's explicit allowlist (see requiredChecksAllowlistedWorkflowFiles()) -- this
# job is PR-triggered automation gated on `github.actor == 'dependabot[bot]'`, not a status
# check every contributor's own PR needs to pass.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Dependabot auto-merge (patch/minor dev-dependencies only)
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Boundary, deliberately conservative: semver-patch or semver-minor AND
      # direct:development only. Never `direct:production` (the locked seven-package
      # require list), never `indirect` (could be a transitive of a production
      # dependency, so it does not get the same free pass), never semver-major.
      - name: Auto-merge eligible Dependabot PRs
        if: |
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          steps.metadata.outputs.dependency-type == 'direct:development'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # Merge commit only: squash and rebase merges are disabled at the repository
        # level (D-25 preserves the RED->GREEN commit history), so `--squash`/`--rebase`
        # would simply fail here.
        run: gh pr merge --auto --merge "${PR_URL}"
