name: supply-chain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref per workflow, for pull requests. A pull request that is pushed to again
# supersedes its own in-flight run rather than paying for both -- 18 pushes on PR #49 each
# started a full set of jobs while the previous set was still running.
#
# Non-pull-request runs are keyed on the COMMIT, not the ref, and that is not cosmetic
# (Codex, local review). `cancel-in-progress: false` does not mean "never superseded": GitHub
# keeps at most ONE pending run per group, so a third push arriving while one run is in
# progress and another is queued REPLACES the queued one. Keyed on the ref, a burst of merges
# to main would silently leave release-candidate commits with no CI run at all. Keyed on the
# sha, every commit gets its own group and can never be superseded by another.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  composer-audit:
    # A single PHP version is enough: composer audit checks the resolved dependency tree against
    # the advisory database, not runtime behaviour, so it does not need to run per matrix leg.
    # No escape hatch on this step -- D-31: any advisory fails the build.
    name: composer audit (fails on any advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: bash scripts/ci/composer-retry.sh install --prefer-dist --no-interaction

      - name: Run composer audit
        run: composer audit

  bc-check:
    # roave/backward-compatibility-check compares source trees between the previous tag and the
    # current one -- not runtime behaviour -- so it runs once, not across the full matrix. PHP 8.4
    # is used because the project's own PHP floor (^8.3, STANDARDS Sec.1) removed the constraint
    # that used to force pinning an older roave release for PHP 8.2 support (01-RESEARCH.md,
    # Pitfall 3 / Open Question 2).
    #
    # roave/backward-compatibility-check is installed here, for this job only, rather than added
    # to composer.json's own require-dev: its own PHP floor has drifted upward release over
    # release, and requiring it project-wide would force every one of the 16 matrix legs in
    # ci.yml (including the PHP 8.3 ones) to satisfy its constraint too, breaking jobs that have
    # nothing to do with this comparison.
    name: backward-compatibility check (roave, single job, greenfield-safe)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # This step resolves the previous release ONCE and hands the tag name to the check below,
      # rather than only answering yes/no and letting roave detect the release itself. roave's own
      # detection parses tag names as version strings via composer/semver, and this repository's
      # tags do not parse: release-please is configured with a component, so it produces
      # `reyemtech/laravel-hubspot-v0.2.0`, and `Semver::sort()` throws
      # `UnexpectedValueException: Invalid version string` on that name where it reads `v0.2.0`
      # fine. The result was `Could not detect any released versions for the given repository` --
      # a hard failure on every pull request from the moment the first tag existed, comparing
      # nothing. It went unnoticed at 0.2.0 because that release's own supply-chain run happened
      # before its tag was pushed.
      #
      # `--sort=-v:refname` orders by the embedded version rather than lexically, so 0.10.0 sorts
      # above 0.9.0 once this package gets that far.
      #
      # Two filters narrow the candidates, and both matter:
      #
      # `--merged HEAD` restricts the list to tags actually reachable from the commit being built.
      # `fetch-depth: 0` fetches every tag in the repository, including ones created AFTER this
      # commit -- so re-running an older workflow run once a newer release exists would otherwise
      # select that newer tag and compare this older tree against a FUTURE release, reporting
      # removals for code that had not been written yet (Codex P2, PR #25).
      #
      # The glob restricts them to this component's release tags, so an unrelated tag pushed by
      # hand cannot become the comparison base. It has to match what release-please is configured
      # to produce in release-please-config.json.
      #
      # A tag pointing AT the built commit is excluded, and that case is not exotic -- it is what
      # happens on every release (Codex P2, PR #25). Merging the release PR triggers this workflow
      # and release-please.yml from the same push, so once release-please has created the tag, the
      # newest reachable release tag IS `HEAD`. `git tag --merged` counts a tag at the commit
      # itself as merged, so it would be selected, and roave would then compare the tree against
      # ITSELF and report green having compared nothing -- at exactly the moment the check matters
      # most. That is the same compare-nothing-and-pass failure the rest of this step exists to
      # prevent, reached through a different door.
      - name: Resolve the previous release, if there is one
        id: previous-release
        run: |
          pattern='reyemtech/laravel-hubspot-v*'
          head_commit="$(git rev-parse 'HEAD^{commit}')"

          # `git rev-list -n 1 <tag>` dereferences an annotated tag to the commit it points at;
          # comparing tag names would not catch this.
          previous=''
          for tag in $(git tag -l --merged HEAD --sort=-v:refname "$pattern"); do
            if [ "$(git rev-list -n 1 "$tag")" != "$head_commit" ]; then
              previous="$tag"
              break
            fi
          done

          if [ -n "$previous" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "tag=$previous" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # No usable base. Three ways that happens, and only two of them may report success.
          if [ -z "$(git tag -l "$pattern")" ]; then
            # Greenfield: no release has ever been tagged.
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "reason=greenfield" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$(git tag -l --merged HEAD "$pattern")" ]; then
            # Every reachable release tag is at HEAD, so this commit IS the first release. There is
            # no earlier release to compare against, which is a fact about the history rather than
            # a misconfiguration. At any later release an earlier tag is also reachable and not at
            # HEAD, so the loop above finds it and this branch is not taken.
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "reason=first-release" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error title=Backward-compatibility check could not resolve a base::Release tags matching ${pattern} exist in this repository, but none is an ancestor of the commit being built, so there is no correct tree to compare against. Failing rather than skipping: a silent skip here would report success having compared nothing, on a repository that HAS releases. This is expected when re-running a workflow from before the first release; re-run it against current main instead."
          exit 1

      # The guard is on tag ABSENCE, not on the tool's exit code -- no unconditional
      # success-on-failure step and no advisory-style opt-out on the step below. Either kind of
      # escape hatch would pass forever, including after the first release -- exactly when this
      # check starts mattering. This message is the only thing that tells a human reading a green
      # run that nothing was actually compared yet.
      # Two distinct reasons reach this step and they are reported distinctly. Printing "no git tag
      # yet" on the commit that carries the FIRST release tag would be false, and a message that is
      # false about why nothing was compared is worse than no message: it is the one line a human
      # reading a green run has to go on.
      - name: Skip -- no previous release to compare against
        if: steps.previous-release.outputs.exists == 'false'
        run: |
          if [ "${{ steps.previous-release.outputs.reason }}" = 'first-release' ]; then
            echo "::notice title=Backward-compatibility check skipped::This commit carries the first release tag, so there is no earlier release for roave/backward-compatibility-check to compare against. This check has NOT verified anything on this run and becomes live at the next tagged release."
          else
            echo "::notice title=Backward-compatibility check skipped::This is a greenfield package with no git tag yet, so there is no previous release for roave/backward-compatibility-check to compare against. This check has NOT verified anything and becomes live automatically at the first tagged release."
          fi

      - name: Install dependencies
        if: steps.previous-release.outputs.exists == 'true'
        run: bash scripts/ci/composer-retry.sh install --prefer-dist --no-interaction

      # --with-all-dependencies is required here: this project's own lockfile pins
      # symfony/console to a major roave/backward-compatibility-check's own require doesn't
      # accept, and a plain `composer require --dev` fails to resolve without permission to
      # adjust already-locked packages for this ephemeral, single-job install (confirmed
      # empirically in a scratch copy of this project's composer.json/composer.lock before
      # writing this step).
      - name: Install roave/backward-compatibility-check
        if: steps.previous-release.outputs.exists == 'true'
        run: composer require --dev roave/backward-compatibility-check --no-interaction --no-progress --with-all-dependencies

      # D-17 additionally allows a detected break when the pull request is labelled `breaking` and
      # targets the next major. That label-aware exception is not wired here -- it is recorded as
      # Phase 9 follow-up work in docs/repo/owner-gated-checklist.md rather than silently dropped,
      # since wiring it safely (without becoming a permanent escape hatch on this step) needs its
      # own design pass.
      #
      # `--from` is passed explicitly, and is not optional here: without it roave falls back to
      # detecting the previous release from tag names it cannot parse. See the resolve step above.
      - name: Run the backward-compatibility check
        if: steps.previous-release.outputs.exists == 'true'
        run: vendor/bin/roave-backward-compatibility-check --from="${{ steps.previous-release.outputs.tag }}" --format=github-actions
