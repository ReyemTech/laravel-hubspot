name: architecture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref per workflow. A pull request that is pushed to again supersedes its own
# in-flight run rather than paying for both -- 18 pushes on PR #49 each started a full set of
# jobs while the previous set was still running. Cancellation is scoped to pull requests:
# a push to main is never superseded by a later one, because each of those commits is a
# release candidate whose gates have to have actually run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  architecture-tests:
    name: architecture rules (tests/Arch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: bash scripts/ci/composer-retry.sh install --prefer-dist --no-interaction

      - name: Run the architecture suite
        run: vendor/bin/pest tests/Arch

  arch-rules-fire:
    name: architecture rules fire (violation-fixture proof)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: bash scripts/ci/composer-retry.sh install --prefer-dist --no-interaction

      - name: Prove every architecture rule fails a build under its own fixture
        run: bash scripts/ci/verify-arch-rules-fire.sh
