name: architecture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  architecture-tests:
    name: architecture rules (tests/Arch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: bash scripts/ci/composer-retry.sh install --prefer-dist --no-interaction

      - name: Run the architecture suite
        run: vendor/bin/pest tests/Arch

  arch-rules-fire:
    name: architecture rules fire (violation-fixture proof)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: bash scripts/ci/composer-retry.sh install --prefer-dist --no-interaction

      - name: Prove every architecture rule fails a build under its own fixture
        run: bash scripts/ci/verify-arch-rules-fire.sh
