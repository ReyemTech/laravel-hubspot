name: Governance

on:
  pull_request:

permissions:
  contents: read

# One run per ref per workflow. A pull request that is pushed to again supersedes its own
# in-flight run rather than paying for both -- 18 pushes on PR #49 each started a full set of
# jobs while the previous set was still running. Cancellation is scoped to pull requests:
# a push to main is never superseded by a later one, because each of those commits is a
# release candidate whose gates have to have actually run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  governance:
    name: Repository governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check repository governance files
        run: bash scripts/ci/check-repo-governance.sh

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    # wagoid/commitlint-github-action calls the GitHub API to enumerate the
    # PR's commits (so it can lint every one, not just the head commit or
    # title -- see the fetch-depth note below). The workflow-level
    # `contents: read` above doesn't cover that API call; without
    # `pull-requests: read` the action fails with "Resource not accessible
    # by integration".
    permissions:
      contents: read
      pull-requests: read
    steps:
      # fetch-depth: 0 gives commitlint the full commit range to compare
      # against the PR's base branch. The commit-depth input below is
      # deliberately left unset so every commit in the PR is linted, not
      # just the head commit or the PR title (D-25, D-26) -- merge commits
      # are the merge strategy, so a stray `feat:` buried in a branch would
      # otherwise reach `main` undetected and bump the minor version.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs
          failOnWarnings: false
