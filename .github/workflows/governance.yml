name: Governance

on:
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    name: Repository governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository governance files
        run: bash scripts/ci/check-repo-governance.sh

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    # wagoid/commitlint-github-action calls the GitHub API to enumerate the
    # PR's commits (so it can lint every one, not just the head commit or
    # title -- see the fetch-depth note below). The workflow-level
    # `contents: read` above doesn't cover that API call; without
    # `pull-requests: read` the action fails with "Resource not accessible
    # by integration".
    permissions:
      contents: read
      pull-requests: read
    steps:
      # fetch-depth: 0 gives commitlint the full commit range to compare
      # against the PR's base branch. The commit-depth input below is
      # deliberately left unset so every commit in the PR is linted, not
      # just the head commit or the PR title (D-25, D-26) -- merge commits
      # are the merge strategy, so a stray `feat:` buried in a branch would
      # otherwise reach `main` undetected and bump the minor version.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs
          failOnWarnings: false

  review-threads:
    name: Review threads (resolved threads need a human reply)
    runs-on: ubuntu-latest
    # scripts/ci/check-review-threads.sh queries this PR's reviewThreads via
    # `gh api graphql` -- the same gap the commitlint job's comment above
    # documents: job-level `contents: read` does not cover that API call,
    # and without `pull-requests: read` it fails with "Resource not
    # accessible by integration".
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check this PR's resolved review threads for a human reply
        run: bash scripts/ci/check-review-threads.sh
      - name: Prove the violation rule fires
        run: bash scripts/ci/check-review-threads.sh --self-test
