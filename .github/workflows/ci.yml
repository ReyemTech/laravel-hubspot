name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: PHP 8.3 / Laravel 12 / prefer-stable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov

      - name: Install dependencies
        run: composer update laravel/framework:^12.0 orchestra/testbench:^10.0 --prefer-dist --prefer-stable --no-interaction

      - name: Run tests
        run: vendor/bin/pest
