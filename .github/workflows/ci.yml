name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov

      # composer.lock is gitignored (correct for a library -- see .gitignore),
      # so each matrix cell must resolve its own dependency set from scratch.
      # A *partial* update (naming packages as positional arguments) requires
      # a preexisting lock to diff against and fails hard without one:
      # "Cannot update only a partial set of packages without a lock file
      # present." --with instead temporarily overrides each package's
      # resolved constraint for this run, inside a *full* update, which needs
      # no lock at all.
      - name: Install dependencies
        run: >
          composer update
          --with illuminate/contracts:${{ matrix.laravel }}
          --with illuminate/support:${{ matrix.laravel }}
          --with illuminate/database:${{ matrix.laravel }}
          --with illuminate/view:${{ matrix.laravel }}
          --with orchestra/testbench:${{ matrix.testbench }}
          --${{ matrix.stability }}
          --prefer-dist
          --no-interaction

      - name: Run tests with coverage
        run: vendor/bin/pest --coverage --min=95

  composer-validate:
    name: composer validate --strict
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Validate composer.json
        run: composer validate --strict

  manifest:
    name: manifest shape (seven production requires)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run manifest test
        run: vendor/bin/pest tests/Ci/ComposerManifestTest.php
