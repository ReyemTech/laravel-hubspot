name: quality

on:
  pull_request:
  push:
    branches: [main]
  # The whole-src/ mutation run, moved off every merge and onto a weekly beat (see the `mutation`
  # job below). Monday 04:00 UTC is deliberately outside working hours in both this repository's
  # timezones, so a fifteen-minute run never competes with a contributor's pull request for
  # concurrency.
  schedule:
    - cron: '0 4 * * 1'
  # So the weekly run can be demanded on the spot -- before cutting a release, or after a change
  # broad enough that waiting until Monday to learn the tree drifted is not good enough.
  workflow_dispatch:

permissions:
  contents: read

# One run per ref per workflow, for pull requests. A pull request that is pushed to again
# supersedes its own in-flight run rather than paying for both -- 18 pushes on PR #49 each
# started a full set of jobs while the previous set was still running.
#
# Non-pull-request runs are keyed on the COMMIT, not the ref, and that is not cosmetic
# (Codex, local review). `cancel-in-progress: false` does not mean "never superseded": GitHub
# keeps at most ONE pending run per group, so a third push arriving while one run is in
# progress and another is queued REPLACES the queued one. Keyed on the ref, a burst of merges
# to main would silently leave release-candidate commits with no CI run at all. Keyed on the
# sha, every commit gets its own group and can never be superseded by another.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  phpstan:
    name: phpstan (level max, no baseline)
    # This workflow also answers a weekly `schedule` and a manual `workflow_dispatch`, and
    # both exist solely for the whole-src/ mutation run at the bottom of this file. Every
    # other gate here is a pull-request gate; re-running it once a week would burn a runner to
    # restate what the last merge already proved.
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: bash scripts/ci/composer-retry.sh install --prefer-dist --no-interaction

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  pint:
    name: pint (style, laravel preset)
    # This workflow also answers a weekly `schedule` and a manual `workflow_dispatch`, and
    # both exist solely for the whole-src/ mutation run at the bottom of this file. Every
    # other gate here is a pull-request gate; re-running it once a week would burn a runner to
    # restate what the last merge already proved.
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: bash scripts/ci/composer-retry.sh install --prefer-dist --no-interaction

      - name: Run Pint
        run: vendor/bin/pint --test

  code-shape:
    name: code shape (file/function length, cyclomatic complexity)
    # This workflow also answers a weekly `schedule` and a manual `workflow_dispatch`, and
    # both exist solely for the whole-src/ mutation run at the bottom of this file. Every
    # other gate here is a pull-request gate; re-running it once a week would burn a runner to
    # restate what the last merge already proved.
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: bash scripts/ci/composer-retry.sh install --prefer-dist --no-interaction

      - name: Run PHPCS
        run: vendor/bin/phpcs --standard=phpcs.xml -q

  source-hygiene:
    name: source hygiene (no deferred-work markers)
    # This workflow also answers a weekly `schedule` and a manual `workflow_dispatch`, and
    # both exist solely for the whole-src/ mutation run at the bottom of this file. Every
    # other gate here is a pull-request gate; re-running it once a week would burn a runner to
    # restate what the last merge already proved.
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run the source-hygiene scan
        run: bash scripts/ci/check-source-hygiene.sh

      - name: Prove the scan rejects both markers
        run: bash scripts/ci/check-source-hygiene.sh --self-test

      # Lives in THIS job because this is the one that installs no dependencies: the retry wrapper
      # now stands in front of every `composer install`/`composer update` in the repository, so
      # proving it works must not itself depend on the thing it protects. During the outage that
      # motivated it, this step would still have run.
      - name: Prove the composer retry wrapper retries a transient failure and still fails a permanent one
        run: bash scripts/ci/composer-retry.sh --self-test

      # Here for the same reason: it needs no dependencies, and the js and docs gates now SKIP their
      # own work on this script's answer. A script that decides whether a required gate runs has to
      # be proven to fail open, and to see a file renamed out of the directory it guards.
      - name: Prove the path scope resolver fails open and sees a rename out of its directory
        run: bash scripts/ci/paths-changed.sh --self-test

  vendor-namespaces:
    name: vendor namespaces (Illuminate backed, no unapproved third party)
    # This workflow also answers a weekly `schedule` and a manual `workflow_dispatch`, and
    # both exist solely for the whole-src/ mutation run at the bottom of this file. Every
    # other gate here is a pull-request gate; re-running it once a week would burn a runner to
    # restate what the last merge already proved.
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Run the vendor-namespace scan
        run: bash scripts/ci/check-vendor-namespaces.sh

      - name: Prove both directions reject their own fixture, and a clean file is accepted
        run: bash scripts/ci/check-vendor-namespaces.sh --self-test

  quality-gates-fire:
    name: quality gates fire (violation-fixture proof)
    # This workflow also answers a weekly `schedule` and a manual `workflow_dispatch`, and
    # both exist solely for the whole-src/ mutation run at the bottom of this file. Every
    # other gate here is a pull-request gate; re-running it once a week would burn a runner to
    # restate what the last merge already proved.
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: bash scripts/ci/composer-retry.sh install --prefer-dist --no-interaction

      - name: Prove PHPStan and the code-shape gate each reject a deliberate violation
        run: bash scripts/ci/verify-quality-gates-fire.sh

  mutation:
    # Only meaningful once the `tests` job (ci.yml) is green: pest --mutate
    # runs the tests covering each mutation, so a red test suite makes this
    # job's own output uninformative rather than a true mutation score. No
    # `needs:` on that job here (they run in separate workflows/files), but
    # a failing `tests` job elsewhere in the same pull request should be
    # read as "the number below isn't meaningful yet", not ignored.
    #
    # SCOPE differs by event, deliberately, and the job name stays the same in every case because it
    # is a required status check — renaming it would silently stop branch protection from ever
    # seeing this gate again (which is exactly what happened to the manifest check in #37).
    #
    #   pull_request           -> only the classes the PR changes, in parallel. Seconds to a couple
    #                             of minutes, with the signal kept where the new code is.
    #   schedule / dispatch    -> the whole of src/, unscoped. This is what catches "a change over
    #                             here weakened a mutant the tests over there used to kill".
    #   push to main           -> NOTHING. See below.
    #
    # The full run was measured at 10.5-16 minutes across ten consecutive runs, all green, with MSI
    # at 96-99% against a floor of 80. At that margin it was not doing gate work per PR; it was
    # costing a quarter of an hour to restate a number that had never moved.
    #
    # It used to run on every push to main, and it no longer does (owner decision, 2026-08-02): a
    # quarter of an hour of runner time per MERGE is the single largest recurring Actions cost in
    # this repository, and it was buying a number that has not moved in ten runs. The cross-tree
    # drift signal is kept -- that was explicitly not up for deletion -- but it is collected once a
    # week rather than once a merge. Worst case, drift is now learnt up to seven days after the
    # merge that caused it instead of minutes after; the scoped per-PR run still refuses new code
    # that is under-tested, which is where the gate actually does its work.
    #
    # `push` is skipped rather than left to resolve to a scoped run with an empty diff: a run that
    # mutates nothing reports green and reads as "the tree was checked", which is worse than a job
    # that plainly did not run. The check is not required on a push to main, so skipping it blocks
    # nothing.
    if: github.event_name != 'push'
    name: mutation (pest --mutate, MSI floor 80)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The scope resolver diffs against the base branch, so the default shallow clone is not
          # enough.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov

      - name: Install dependencies
        run: bash scripts/ci/composer-retry.sh install --prefer-dist --no-interaction

      - name: Prove the scope resolver maps every src/ file to a class that autoloads
        run: bash scripts/ci/mutation-scope.sh --self-test

      - name: Resolve the mutation scope
        id: scope
        run: |
          # Anything that is not a pull request is the weekly beat or a manual dispatch, and both
          # exist precisely to mutate the whole tree. A push to main never reaches this step at
          # all -- the job is skipped for that event (see the `if` on this job).
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "${{ github.event_name }}: mutating the whole of src/."
            exit 0
          fi

          # No `|| true` on either line. A fetch or diff that fails means the checkout is
          # broken, and a broken checkout must fail this required check rather than resolve to
          # an empty scope that reads as "nothing to mutate" (Codex, PR #43).
          #
          # `--depth=0` is NOT valid here. `fetch-depth: 0` is an actions/checkout convention
          # meaning "full history"; git fetch's own --depth takes a POSITIVE integer and rejects
          # zero with `fatal: depth 0 is not a positive number`. It was in the first draft of this
          # step and `|| true` hid it — so removing the suppression is what made the real bug
          # visible, which is the whole argument for failing closed (Codex, PR #43).
          #
          # An explicit refspec, because actions/checkout leaves a PR at the merge ref without
          # necessarily creating a remote-tracking ref for the base branch.
          git fetch --no-tags origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          classes="$(bash scripts/ci/mutation-scope.sh "origin/${{ github.base_ref }}")"

          if [ -z "$classes" ]; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "This pull request changes no PHP file under src/. Nothing to mutate."
            exit 0
          fi

          echo "mode=scoped" >> "$GITHUB_OUTPUT"
          echo "classes=${classes}" >> "$GITHUB_OUTPUT"
          echo "Mutating only what this pull request changes:"
          printf '  %s\n' ${classes//,/ }

      - name: Run the mutation floor
        run: |
          case "${{ steps.scope.outputs.mode }}" in
            skip)
              echo "Skipped: no src/ change in this pull request, so there is no mutation to run."
              echo "The whole-src run executes weekly (Monday 04:00 UTC) and on workflow_dispatch."
              ;;
            scoped)
              vendor/bin/pest --mutate --parallel --min=80 \
                --class='${{ steps.scope.outputs.classes }}'
              ;;
            *)
              vendor/bin/pest --mutate --parallel --min=80
              ;;
          esac
