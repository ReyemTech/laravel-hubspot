name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  phpstan:
    name: phpstan (level max, no baseline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  pint:
    name: pint (style, laravel preset)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run Pint
        run: vendor/bin/pint --test

  code-shape:
    name: code shape (file/function length, cyclomatic complexity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run PHPCS
        run: vendor/bin/phpcs --standard=phpcs.xml -q

  source-hygiene:
    name: source hygiene (no deferred-work markers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run the source-hygiene scan
        run: bash scripts/ci/check-source-hygiene.sh

      - name: Prove the scan rejects both markers
        run: bash scripts/ci/check-source-hygiene.sh --self-test

  vendor-namespaces:
    name: vendor namespaces (Illuminate backed, no unapproved third party)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Run the vendor-namespace scan
        run: bash scripts/ci/check-vendor-namespaces.sh

      - name: Prove both directions reject their own fixture, and a clean file is accepted
        run: bash scripts/ci/check-vendor-namespaces.sh --self-test

  quality-gates-fire:
    name: quality gates fire (violation-fixture proof)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Prove PHPStan and the code-shape gate each reject a deliberate violation
        run: bash scripts/ci/verify-quality-gates-fire.sh

  mutation:
    # Only meaningful once the `tests` job (ci.yml) is green: pest --mutate
    # runs the tests covering each mutation, so a red test suite makes this
    # job's own output uninformative rather than a true mutation score. No
    # `needs:` on that job here (they run in separate workflows/files), but
    # a failing `tests` job elsewhere in the same pull request should be
    # read as "the number below isn't meaningful yet", not ignored.
    #
    # SCOPE differs by event, deliberately, and the job name stays the same either way because it
    # is a required status check — renaming it would silently stop branch protection from ever
    # seeing this gate again (which is exactly what happened to the manifest check in #37).
    #
    #   pull_request  -> only the classes the PR changes, in parallel. Seconds instead of ~15
    #                    minutes, with the signal kept where the new code is.
    #   push to main  -> the whole of src/, unscoped. This is what still catches "a change over
    #                    here weakened a mutant the tests over there used to kill" — after merge
    #                    rather than before it, which is the deliberate trade.
    #
    # The full run was measured at 10.5-16 minutes across ten consecutive runs, all green, with MSI
    # at 96-99% against a floor of 80. At that margin it was not doing gate work per PR; it was
    # costing a quarter of an hour to restate a number that had never moved.
    name: mutation (pest --mutate, MSI floor 80)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The scope resolver diffs against the base branch, so the default shallow clone is not
          # enough.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Prove the scope resolver maps every src/ file to a class that autoloads
        run: bash scripts/ci/mutation-scope.sh --self-test

      - name: Resolve the mutation scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "Push to main: mutating the whole of src/."
            exit 0
          fi

          # No `|| true` on either line. A fetch or diff that fails means the checkout is
          # broken, and a broken checkout must fail this required check rather than resolve to
          # an empty scope that reads as "nothing to mutate" (Codex, PR #43).
          #
          # `--depth=0` is NOT valid here. `fetch-depth: 0` is an actions/checkout convention
          # meaning "full history"; git fetch's own --depth takes a POSITIVE integer and rejects
          # zero with `fatal: depth 0 is not a positive number`. It was in the first draft of this
          # step and `|| true` hid it — so removing the suppression is what made the real bug
          # visible, which is the whole argument for failing closed (Codex, PR #43).
          #
          # An explicit refspec, because actions/checkout leaves a PR at the merge ref without
          # necessarily creating a remote-tracking ref for the base branch.
          git fetch --no-tags origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          classes="$(bash scripts/ci/mutation-scope.sh "origin/${{ github.base_ref }}")"

          if [ -z "$classes" ]; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "This pull request changes no PHP file under src/. Nothing to mutate."
            exit 0
          fi

          echo "mode=scoped" >> "$GITHUB_OUTPUT"
          echo "classes=${classes}" >> "$GITHUB_OUTPUT"
          echo "Mutating only what this pull request changes:"
          printf '  %s\n' ${classes//,/ }

      - name: Run the mutation floor
        run: |
          case "${{ steps.scope.outputs.mode }}" in
            skip)
              echo "Skipped: no src/ change in this pull request, so there is no mutation to run."
              echo "The whole-src run still executes on push to main."
              ;;
            scoped)
              vendor/bin/pest --mutate --parallel --min=80 \
                --class='${{ steps.scope.outputs.classes }}'
              ;;
            *)
              vendor/bin/pest --mutate --parallel --min=80
              ;;
          esac
